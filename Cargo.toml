[package]
name = "openidea-plugin-bertyhell-string-manipulation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK of OpenIDEA 0.1.39 (plugin API 1.3, the first with context submenus):
# the package loads in that release and every later one.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.39" }
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
regex-lite = "0.1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"

[dev-dependencies]
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

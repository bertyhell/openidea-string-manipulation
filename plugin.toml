id = "bertyhell.string-manipulation"
name = "String Manipulation"
version = "0.1.0"
description = "Case switching, escaping, encoding, hashing, sorting, filtering, aligning and incrementing text, on every selection at once. Press Alt+M for the menu."
authors = ["Bert Verhelst"]
homepage = "https://github.com/bertyhell/openidea-string-manipulation"
license = "MIT"
change-notes = "0.1.0 — first release: 113 actions in nine groups, a searchable menu (Alt+M) and Repeat Last Action."
categories = ["tools"]
# Context submenus are new in plugin API 1.3 (OpenIDEA 0.1.39).
engines.openidea = "^1.3"
icon = "icon.svg"
wasm = "dist/plugin.wasm"
# The commands are declared below, so Find Action and the keymap list them
# before the code is ever loaded; it loads on the first one run.
activation = ["on-command:*"]

[capabilities]
required = ["editor.read", "editor.write"]
# Remembers the last action and prompt answers for Repeat Last Action.
optional = ["storage"]

[[contributes.keymaps]]
command = "popup"
key = "Alt+M"

[[contributes.menus]]
menu = "editor.context"
command = "popup"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "repeat-last"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "case-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "escape-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "unicode-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "encode-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "increment-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "sort-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "filter-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "align-menu"
submenu = "String Manipulation"

[[contributes.menus]]
menu = "editor.context"
command = "transform-menu"
submenu = "String Manipulation"

